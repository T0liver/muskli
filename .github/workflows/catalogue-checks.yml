# docs/CATALOGUE.md section 5 on every PR into catalogue or main that touches catalogue/**.
name: Catalogue checks

on:
  pull_request:
    branches: [catalogue, main]
    paths: ["catalogue/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit must be present for `git show <base>:catalogue/catalogue.json`.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check-jsonschema (CI only, D-025)
        run: python -m pip install check-jsonschema==0.39.0

      - name: Checker unit tests
        run: python -m unittest discover -s catalogue/tools -p "test_*.py" -v

      - name: Rule 2, JSON Schema
        run: check-jsonschema --schemafile catalogue/catalogue.schema.json catalogue/catalogue.json

      - name: Rules 1 and 3-7 against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python catalogue/tools/check_catalogue.py --base-ref "$BASE_SHA"
